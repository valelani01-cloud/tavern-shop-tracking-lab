    }
    input:focus, textarea:focus, select:focus { border-color: #a07840; }

      border-radius: 4px;
      width: 100%;
      font-weight: bold;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn-send:hover { background: #f0d060; }
    .confirm-msg {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #2a3a1a;

<nav>

  <a href="index.html">Home</a>

  <a href="contact.html">Contatti</a>

<div class="container">
  <h1>📜 Contattaci</h1>
  <p class="subtitle">Hai domande sui nostri prodotti? Scrivici!</p>

  <form id="contact-form">
    <div class="form-group">
      <label for="name">Nome</label>
      <input type="text" id="name" placeholder="Il tuo nome" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="la@tua.email" required>
    </div>
    <div class="form-group">
      <label for="subject">Argomento</label>
      <select id="subject">
        <option value="info">Informazioni prodotto</option>
        <option value="order">Ordine e spedizione</option>
        <option value="return">Reso e rimborso</option>
        <option value="other">Altro</option>
      </select>
    </div>
    <div class="form-group">
      <label for="message">Messaggio</label>
      <textarea id="message" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
    </div>
    <button type="submit" class="btn-send" id="btn-send">Invia messaggio</button>
    <div class="confirm-msg" id="confirm-msg">✓ Messaggio inviato! Ti risponderemo entro 24 ore.</div>
  </form>
</div>

<script>
window.dataLayer = window.dataLayer || [];

// Evento view_contact_page — si attiva al caricamento
dataLayer.push({
  event: 'view_contact_page',
  page_type: 'contact'
});

// Evento form_start — si attiva al primo clic su un campo
let formStarted = false;
document.getElementById('contact-form').addEventListener('focusin', function() {
  if (!formStarted) {
    formStarted = true;
    dataLayer.push({
      event: 'contact_form_start'
    });
  }
});

// Evento contact_form_submit — si attiva all'invio del form
document.getElementById('contact-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const subject = document.getElementById('subject').value;
  dataLayer.push({
    event: 'contact_form_submit',
    contact_subject: subject
  });
  document.getElementById('confirm-msg').style.display = 'block';
});
</script>
</body>
</html>
